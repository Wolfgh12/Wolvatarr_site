name: Automated Coolify Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Authenticated Coolify Build
        run: |
          curl -sS -i -X GET "http://185.216.75.85:8000/api/v1/deploy?uuid=nu74ozrqbdlikaoyh7wnxhl9&force=false" \
               -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
